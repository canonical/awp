name: frama-c-sdk
version: "32.1"
title: Frama-C for auto-wp
summary: Frama-C 32.1 with auto-wp's patches, macsl, Why3, Coq 8.20.1, Alt-Ergo, Z3
description: |
  The Frama-C toolchain auto-wp's C campaigns run: Frama-C 32.1 (Germanium)
  built from source with auto-wp's frama-c-patches, the macsl plugin, Why3
  1.8 with its Coq 8.20.1 realizations, Alt-Ergo and Z3, in a read-only
  opam switch. Build it with `make sdk-framac` from the auto-wp repository,
  which first copies the patches and bin/fetch-sources.sh into vendor/.
  Alt-Ergo 2.6.4 is bundled under the OCamlPro Non-Commercial Purpose
  License: research use only, see share/licenses/alt-ergo/ in the SDK.
license: LGPL-2.1-only AND LicenseRef-OCamlPro-Non-Commercial-1.0
platforms:
  noble:
    build-on: [ubuntu@24.04:amd64]
    build-for: [ubuntu@24.04:amd64]
  resolute:
    build-on: [ubuntu@26.04:amd64]
    build-for: [ubuntu@26.04:amd64]
  # arm64 (Apple Silicon VMs, arm64 servers): built on an arm64 host, e.g.
  # the GitHub ubuntu-24.04-arm runner (.github/workflows/sdks-arm64.yml);
  # sdkcraft does not cross-build.
  noble-arm64:
    build-on: [ubuntu@24.04:arm64]
    build-for: [ubuntu@24.04:arm64]
  resolute-arm64:
    build-on: [ubuntu@26.04:arm64]
    build-for: [ubuntu@26.04:arm64]

parts:
  framac:
    plugin: nil
    source: vendor
    build-packages: [opam, build-essential, git, curl, patch, unzip, rsync, m4,
                     pkg-config, python3, ca-certificates, libgmp-dev, zlib1g-dev,
                     libgtk-3-dev, libgtksourceview-3.0-dev, libgraphviz-dev, graphviz,
                     autoconf]
    override-build: |
      # opam roots embed absolute paths, so the switch is built at the path
      # it has at run time: /opt/frama-c-sdk, which setup-base links to $SDK.
      R=/opt/frama-c-sdk
      rm -rf "$R"; mkdir -p "$R"
      export OPAMROOT="$R/opam" OPAMYES=1 OPAMCOLOR=never
      opam init --disable-sandboxing --bare --no-setup
      opam switch create framac-coq8 ocaml-base-compiler.4.14.2
      eval "$(opam env --switch=framac-coq8 --set-switch)"
      # Coq FIRST, PINNED: Why3 1.8 builds its realizations against it, and
      # a plain `opam install coq.8.20.1` is upgraded to Coq 9.x as soon as a
      # later install upgrades dune (seen 2026-10-31 with alt-ergo 2.6.4).
      opam pin add coq 8.20.1
      # alt-ergo PINNED to 2.6.4: Why3 1.8's prover-detection data does not
      # recognise 2.6.5 (released after 2026-10-31), so an unpinned install
      # floats up and -wp-detect then lists no Alt-Ergo (check-health fails);
      # the tests also assert exactly Alt-Ergo 2.6.4.
      opam install "why3>=1.8.0" "why3<1.9" "why3-coq>=1.8.0" "why3-coq<1.9" alt-ergo.2.6.4 z3
      test -f "$(why3 --print-libdir)/coq/BuiltIn.vo"
      coqc --version | grep -q "version 8\.20\.1"
      # The patched sources, exactly as a generated project gets them.
      bin/fetch-sources.sh
      grep -q land_le_l framac-src/src/plugins/wp/share/why3/frama_c_wp/cbits.mlw
      # Frama-C from the patched tree, as an opam pin (all plugins, deps).
      (cd framac-src && opam pin add --kind=path frama-c .)
      frama-c -version | grep -q '^32\.1'
      coqc --version | grep -q "version 8\.20\.1"   # still pinned after the Frama-C pin
      grep -q land_le_l "$(frama-c -print-share-path)/wp/why3/frama_c_wp/cbits.mlw"
      # macsl (Plane H), loaded with -load-module.
      (cd macsl && dune build)
      mkdir -p "$R/macsl"
      cp macsl/_build/default/src/macsl.cmxs "$R/macsl/"
      # The patched sources, read-only, for the skills that read Frama-C's code.
      mkdir -p "$R/src"
      rsync -a --exclude _build --exclude .git framac-src/ "$R/src/frama-c-32.1/"
      # The run-time environment: it prepends to PATH, never replaces it.
      S="$OPAMROOT/framac-coq8"
      {
        echo "# The run-time environment of the $CRAFT_PROJECT_NAME opam switch."
        echo "export OPAMROOT='$OPAMROOT' OPAMSWITCH='framac-coq8' OPAM_SWITCH_PREFIX='$S'"
        echo "export CAML_LD_LIBRARY_PATH='$S/lib/stublibs:$S/lib/ocaml/stublibs:$S/lib/ocaml'"
        echo "export OCAML_TOPLEVEL_PATH='$S/lib/toplevel'"
        echo "export PATH='$S/bin':\"\$PATH\""
      } > "$R/env.sh"
      # Prune what the run time does not need.
      opam clean --all-switches --download-cache --logs
      rm -rf "$OPAMROOT/download-cache" "$OPAMROOT/repo" \
             "$OPAMROOT"/framac-coq8/.opam-switch/sources \
             "$OPAMROOT"/framac-coq8/.opam-switch/build \
             "$OPAMROOT"/framac-coq8/doc "$OPAMROOT"/framac-coq8/man
      cp -a "$R/." "$CRAFT_PART_INSTALL/"
  config:
    plugin: dump
    source: files
  # The read-only framac-mcp adapter source (spec frama-c-mcp.md). setup-base
  # pip-installs it from $SDK/mcp into a venv OUTSIDE the read-only switch
  # (open point O-3). Only the adapter ships here; its tests stay in the repo.
  mcp:
    plugin: dump
    source: mcp
    organize:
      '*': mcp/
